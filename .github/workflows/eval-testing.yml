name: Eval-testing Skill Evals

# Canonical paid evals run from darbyhuye/opentelemetry-agent-skills while this
# workflow is branch-scoped. The org mirror is non-canonical until the workflow
# graduates to main and its eval-testing environment has OPENROUTER_API_KEY.
# This workflow is deliberately branch-scoped. Ordinary pushes evaluate suites
# affected by that push. A push whose head commit contains [eval-all] evaluates
# every runnable suite, including an empty commit made only to request a run.
# Manual dispatch remains available if this workflow eventually reaches main.
on:
  push:
    branches:
      - eval-testing
  workflow_dispatch:
    inputs:
      scope:
        description: Which skill suites should run?
        required: true
        default: all
        type: choice
        options:
          - all
          - changed

concurrency:
  group: eval-testing-skill-evals
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-skill-suites:
    if: github.ref_name == 'eval-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: eval-testing
    env:
      AGENT_MODEL: ${{ vars.OPENROUTER_EVAL_MODEL || 'openai/gpt-4o-mini' }}
      JUDGE_MODEL: ${{ vars.OPENROUTER_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
      EVAL_REPS: ${{ vars.SKILL_EVAL_REPS || '1' }}

    steps:
      - name: Checkout eval-testing skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: skills-repo
          persist-credentials: false

      - name: Check OpenRouter configuration
        id: harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured; skipping paid model evals." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=yes" >> "$GITHUB_OUTPUT"
          fi

      # A silent fallback here once ran three full eval sweeps on the default
      # model while we believed a configured one was under test — warn loudly
      # so the models that actually ran are never a surprise again.
      - name: Report model configuration
        env:
          EVAL_MODEL_VAR: ${{ vars.OPENROUTER_EVAL_MODEL }}
          JUDGE_MODEL_VAR: ${{ vars.OPENROUTER_JUDGE_MODEL }}
        run: |
          echo "Agent model: \`$AGENT_MODEL\` — Judge model: \`$JUDGE_MODEL\` — Reps: $EVAL_REPS" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${EVAL_MODEL_VAR:-}" ]; then
            echo "::warning::OPENROUTER_EVAL_MODEL is not set on the eval-testing environment; agent sessions fell back to $AGENT_MODEL."
            echo "⚠️ **OPENROUTER_EVAL_MODEL is unset — agent ran on the fallback \`$AGENT_MODEL\`.**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "${JUDGE_MODEL_VAR:-}" ]; then
            echo "::warning::OPENROUTER_JUDGE_MODEL is not set on the eval-testing environment; grading fell back to $JUDGE_MODEL."
            echo "⚠️ **OPENROUTER_JUDGE_MODEL is unset — grading ran on the fallback \`$JUDGE_MODEL\`.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout skills-test-runner
        if: steps.harness.outputs.available == 'yes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ollygarden/skills-test-runner
          ref: a7aa2f8edf1d920bb7ee3f191cae3d09de38e23f # merged staged-path fix (skills-test-runner PR #25)
          path: skills-test-runner
          ssh-key: ${{ secrets.SKILLS_TEST_RUNNER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Bun
        if: steps.harness.outputs.available == 'yes'
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - name: Install runner dependencies
        if: steps.harness.outputs.available == 'yes'
        working-directory: skills-test-runner
        run: bun install --frozen-lockfile

      - name: Select skill suites
        if: steps.harness.outputs.available == 'yes'
        env:
          DISPATCH_SCOPE: ${{ inputs.scope || 'changed' }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
          PUSH_RUN_ALL: ${{ contains(github.event.head_commit.message, '[eval-all]') }}
        run: |
          set -euo pipefail
          mkdir -p results

          : > results/non-runnable-skills.txt
          for skill_dir in skills-repo/skills/*; do
            [ -f "$skill_dir/SKILL.md" ] || continue
            if [ ! -f "$skill_dir/evals/evals.json" ]; then
              printf '%s\n' "${skill_dir#skills-repo/}" >> results/non-runnable-skills.txt
            fi
          done
          sort -u -o results/non-runnable-skills.txt results/non-runnable-skills.txt

          run_all=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_SCOPE" = "all" ]; then
            run_all=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$PUSH_RUN_ALL" = "true" ]; then
            run_all=true
          fi

          if [ "$run_all" = "true" ]; then
            find skills-repo/skills -mindepth 3 -maxdepth 3 \
              -path '*/evals/evals.json' -type f -print \
              | sed -e 's#^skills-repo/##' -e 's#/evals/evals.json$##' \
              | sort -u > results/suite-paths.txt

            jq -Rn '
              [inputs | select(length > 0)] as $suites |
              {
                status: (if ($suites | length) > 0 then "selected" else "skipped" end),
                skillRoots: ["skills"],
                changedSkills: [],
                suitePaths: $suites,
                warnings: [],
                deletedSkills: [],
                runnerChanged: false
              }
            ' < results/suite-paths.txt > results/selection.json
          else
            base=origin/main
            head=HEAD
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              base="$PUSH_BASE"
              head="$PUSH_HEAD"
            fi
            bun run skills-test-runner/src/github/detect-changed-skills.ts \
              --repo-root "$GITHUB_WORKSPACE/skills-repo" \
              --base "$base" \
              --head "$head" \
              --skill-root skills \
              --runner-change-policy skip \
              --out "$GITHUB_WORKSPACE/results/selection.json" \
              --paths-only "$GITHUB_WORKSPACE/results/suite-paths.txt"
          fi

          cat results/selection.json
          if [ -s results/non-runnable-skills.txt ]; then
            {
              echo "## Skills without eval suites"
              echo
              echo "These skills cannot run until they have an evals/evals.json:"
              while IFS= read -r skill; do printf -- '- `%s`\n' "$skill"; done < results/non-runnable-skills.txt
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore eval cache
        if: steps.harness.outputs.available == 'yes'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .skill-eval-cache
          key: eval-testing-${{ runner.os }}-${{ hashFiles('skills-test-runner/bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            eval-testing-${{ runner.os }}-${{ hashFiles('skills-test-runner/bun.lock') }}-
            eval-testing-${{ runner.os }}-

      - name: Run selected skill suites
        if: steps.harness.outputs.available == 'yes'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          if [ ! -s results/suite-paths.txt ]; then
            echo "No runnable skill suites were selected." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status=0
          while IFS= read -r suite; do
            [ -n "$suite" ] || continue
            slug=${suite//\//-}
            echo "## $suite" >> "$GITHUB_STEP_SUMMARY"
            set +e
            bun run skills-test-runner/src/cli.ts "$GITHUB_WORKSPACE/skills-repo/$suite" \
              --results "$GITHUB_WORKSPACE/results/$slug.json" \
              --cache-dir "$GITHUB_WORKSPACE/.skill-eval-cache" \
              --reps "$EVAL_REPS" \
              --verbose \
              --harness openrouter \
              --model "$AGENT_MODEL" \
              --judge-model "$JUDGE_MODEL" \
              2>&1 | tee "$GITHUB_WORKSPACE/results/$slug.log"
            suite_status=${PIPESTATUS[0]}
            set -e
            sed 's/^/    /' "$GITHUB_WORKSPACE/results/$slug.log" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if [ "$suite_status" -eq 2 ]; then
              status=2
            elif [ "$suite_status" -eq 1 ] && [ "$status" -eq 0 ]; then
              status=1
            fi
          done < results/suite-paths.txt

          if [ "$status" -eq 1 ]; then
            echo "One or more suites reported valid eval misses. Results are advisory; inspect the scores and artifacts." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Upload eval results
        if: always() && steps.harness.outputs.available == 'yes'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eval-testing-results-${{ github.sha }}
          path: results/
          if-no-files-found: warn
